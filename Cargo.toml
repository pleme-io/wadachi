[workspace]
resolver = "2"
members = ["wadachi-spec", "wadachi"]

[workspace.package]
version = "0.1.5"
edition = "2024"
rust-version = "1.89.0"
license = "MIT"
repository = "https://github.com/pleme-io/wadachi"
homepage = "https://github.com/pleme-io/wadachi"

[workspace.dependencies]
wadachi-spec = { version = "0.1.0", path = "wadachi-spec" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true
