[package]
# crates.io package name is pleme-io-prefixed because the bare `wadachi` name is
# already taken upstream. The lib is still imported as `wadachi` and the binary
# is still `wadachi` (see [lib]/[[bin]] below) — only the registry name changes.
name = "pleme-io-wadachi"
description = "Wadachi (轍 — \"the well-worn rut\") — a native typed-Rust directory frecency primitive for the pleme-io fleet. Records the directories you walk, ranks them by frequency+recency through the shared wadachi-spec core, and serves a fuzzy `cd` from a SQLite store that frost, skim-cd and mado all share. A zoxide replacement, not a wrapper."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
categories = ["command-line-utilities", "filesystem"]
keywords = ["frecency", "cd", "zoxide", "directory", "navigation"]

# NOTE: the lib crate name is the package-derived `pleme_io_wadachi` (no [lib]
# name override). A lib name ≠ package name breaks substrate's gen lockfile-
# builder: gen-cargo encodes consumers' `--extern wadachi=libwadachi-*` but the
# builder emits `libpleme_io_wadachi-*` → "extern location does not exist".
# Consumers therefore `use pleme_io_wadachi`. The BINARY stays `wadachi`.
[[bin]]
name = "wadachi"
path = "src/bin/wadachi.rs"

[dependencies]
wadachi-spec = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
rusqlite = { version = "0.32", features = ["bundled"] }
# Cargo features activate globally per-target — turning on a notify macOS
# backend feature here would add the apple-only backend crate as an
# unconditional dep for every target (fsevent-sys fails to compile on Linux).
# The only correct seam is target-gating the feature itself: Linux gets bare
# notify (inotify, its only Linux backend); macOS opts into FSEvents below.
# Same proven pattern as pleme-io/shikumi.
notify = { version = "8.2", default-features = false }

# macOS opts into the FSEvents backend (NOT kqueue — kqueue burns one fd per
# watched dir, untenable for the indexer's recursive watch over ~/code).
[target.'cfg(target_os = "macos")'.dependencies]
notify = { version = "8.2", default-features = false, features = ["macos_fsevent"] }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = "3"

[lints]
workspace = true
